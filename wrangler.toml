# ICOS 2027 on Cloudflare Pages + Pages Functions + D1.
# The account is at its 10-database D1 limit, so this project uses its own prefixed tables
# (icos2027_bookings, icos2027_settings) inside the shared D1 database. Tables are created automatically.
name = "icos2027"
pages_build_output_dir = "./public"
compatibility_date = "2024-09-23"

[vars]
TABLE_PREFIX = "icos2027"

[[d1_databases]]
binding = "DB"
database_name = "ferroxpad-cfg-preview"
database_id = "f33b855f-302a-471d-aaca-e32d141cd7b6"

# Secrets (set with `wrangler pages secret put`): ADMIN_PASSWORD_HASH (sha256 hex), SESSION_SECRET
